name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project itself (不把源码目录当可导入路径)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[detect,vision]" pytest
      - name: Deploy script syntax (bash -n)
        run: bash -n deploy/install.sh
      - name: systemd unit 单一真值渲染 + systemd-analyze verify
        run: |
          python -m scam.linux_unit render \
            --user "$USER" --workdir "$PWD" --python "$(command -v python3)" \
            > /tmp/scam-nvr.service
          cat /tmp/scam-nvr.service
          systemd-analyze verify /tmp/scam-nvr.service
      - name: Run tests (含 Linux 服务级 smoke)
        run: python -m pytest tests/ -v
      - name: Linux NVR edition contract
        run: |
          python -m scam.linux_nvr --help
          python -c "from scam.editions import LINUX_NVR; assert LINUX_NVR.key == 'linux-nvr'"
      - name: Release packaging gate (敏感面双闸 + 可复现打包自检)
        run: |
          python scripts/package_release.py --dry-run > /tmp/pack-list.txt
          wc -l /tmp/pack-list.txt
          python scripts/package_release.py --output /tmp/scam-ci.tar.gz
          python scripts/package_release.py --check /tmp/scam-ci.tar.gz
          python scripts/fetch_models.py --list

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project itself
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[detect,vision]" pytest
      - name: Run tests (服务级 smoke 在 Windows 自动跳过)
        run: python -m pytest tests/ -v
      - name: Release packaging dry-run (敏感面闸跨平台)
        shell: bash
        run: |
          python scripts/package_release.py --dry-run | tail -1
          python scripts/package_release.py --output "$RUNNER_TEMP/scam-ci.tar.gz"
          python scripts/package_release.py --check "$RUNNER_TEMP/scam-ci.tar.gz"
      - name: Platform layer smoke (UTF-8 输出 + 数据目录)
        shell: bash
        run: |
          python -c "
          from scam.platform import fix_console_encoding, safe_print, app_data_dir, default_data_root
          fix_console_encoding()
          safe_print('中文/emoji 输出 OK')
          assert default_data_root(), 'data root empty'
          print('platform OK')
          "
      - name: Win11 entry smoke (无相机配置也能起值守不早退)
        shell: bash
        run: |
          cat > smoke-cameras.json <<'EOF'
          {
            "version": "0.3",
            "cameras": [{"id": "ci-cam", "enabled": true, "source": "rtsp://127.0.0.1:9/x",
              "detector": {"engine": "onnx", "model": "models/person-detector.onnx",
                           "classes": ["person"], "conf": 0.4},
              "zones": [{"id": "z1", "name": "z", "cells": [0, 1],
                         "rules": [{"cls": "person", "events": ["enter"], "severity": "high"}]}]}]
          }
          EOF
          python -c "
          import subprocess, sys, time
          p = subprocess.Popen([sys.executable, '-u', '-m', 'scam.win11',
                                '--config', 'smoke-cameras.json',
                                '--db', 'smoke.db', '--no-workbench'],
                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          time.sleep(6)
          assert p.poll() is None, 'nvr exited early with code %s' % p.returncode
          p.terminate(); p.wait(timeout=15)
          print('win11 smoke OK')
          "
      - name: Deploy script syntax (PowerShell 5.1 + 7 双解析)
        shell: pwsh
        run: |
          $parseScript = Join-Path $env:RUNNER_TEMP 'parse-check.ps1'
          @'
          param($f)
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "parse OK: $f"
          '@ | Set-Content -Path $parseScript
          & powershell -NoProfile -ExecutionPolicy Bypass -File $parseScript "$PWD/deploy/install-win11.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $parseScript "$PWD/deploy/install-win11.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
