[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam"
version = "0.2.0"
description = "语义摄像头 v2 —— Linux NVR / Windows 11 上的场所语义值守层（唯一上游：VUS）"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
detect = ["onnxruntime"]
vision = ["opencv-python-headless", "pillow"]
# 可选本地语义模型栈（L3 视觉语言模型运行所需；权重仍然由使用者自备）
local-model = ["torch", "transformers", "tokenizers", "safetensors"]
discover = ["wsdiscovery"]
mqtt = ["paho-mqtt"]
dev = ["pytest"]

[project.scripts]
scam-linux-nvr = "scam.linux_nvr:main"
scam-win11 = "scam.win11:main"
scam-win11-preflight = "scam.win11_acceptance:main"
scam-win11-r3-acceptance = "scam.win11_r3_acceptance:main"

[tool.setuptools.packages.find]
include = ["scam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
